<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="A Garden of Hope 英语点读。点击单词听英式发音，点击小喇叭朗读整句。">
  <title>希望的小花园 · 英语点读</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230071e3'/%3E%3Cpath d='M16 18h13c4 0 6 3 6 5v25c-2-3-5-5-9-5H16zm32 0H35v30c2-3 5-5 9-5h4z' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#vocabulary">跳到学习内容</a>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill-icon" d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect class="fill-icon" x="6" y="6" width="12" height="12" rx="3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2.4-2-5.7-2.7-9-2v15c3.3-.7 6.6 0 9 2m0-15c2.4-2 5.7-2.7 9-2v15c-3.3-.7-6.6 0-9 2V6Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  </svg>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="#top" aria-label="英语点读，回到顶部">
        <span class="brand-mark"><svg><use href="#i-book"/></svg></span>
        <span>英语点读<span class="brand-divider">/</span><span class="brand-en">English Reader</span></span>
      </a>
      <nav class="section-nav" aria-label="页面导航">
        <a href="#vocabulary">单词</a><a href="#reading">文章</a>
      </nav>
    </div>
  </header>

  <main id="top" class="page">
    <section class="document-heading" aria-labelledby="document-title">
      <div class="eyebrow"><span class="blue-dot"></span>英语阅读练习<span class="eyebrow-separator">·</span>英式发音</div>
      <h1 id="document-title" lang="en">A Garden of Hope</h1>
      <p class="chinese-title">希望的小花园</p>
      <div class="document-intro">
        <p>轻点英文单词听发音，点句后的<svg class="inline-icon"><use href="#i-volume"/></svg>听整句。</p>
        <div class="content-count"><span>15 个单词</span><span class="count-divider"></span><span>10 个句子</span></div>
      </div>
    </section>

    <div class="preferences" role="group" aria-label="朗读与显示设置">
      <label class="speed-control" for="speed"><span>朗读速度</span><span class="select-wrap"><select id="speed" aria-label="朗读速度"><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option></select><svg><use href="#i-chevron"/></svg></span></label>
      <label class="translation-control"><input type="checkbox" id="show-translation" checked><span class="switch-track" aria-hidden="true"><span></span></span><span>显示译文</span></label>
    </div>

    <section id="vocabulary" class="learning-section" aria-labelledby="vocab-title">
      <div class="section-heading">
        <div><span class="section-index">01</span><h2 id="vocab-title">单词先读</h2><span class="section-caption" lang="en">Vocabulary</span></div>
        <button id="play-vocabulary" class="quiet-button"><svg><use href="#i-play"/></svg><span>依次朗读</span></button>
      </div>
      <div id="vocabulary-grid" class="vocabulary-grid"></div>
    </section>

    <section id="reading" class="learning-section reading-section" aria-labelledby="reading-title">
      <div class="section-heading">
        <div><span class="section-index">02</span><h2 id="reading-title">读一段故事</h2><span class="section-caption" lang="en">Reading</span></div>
        <button id="play-reading" class="primary-button"><svg><use href="#i-play"/></svg><span>朗读文章</span></button>
      </div>
      <article class="reading-paper" aria-label="A Garden of Hope 英文文章">
        <div class="paper-topline"><span lang="en">A GARDEN OF HOPE</span><span class="paper-mode"><span></span>点词即读</span></div>
        <div id="article-content" lang="en"></div>
        <div class="translation-panel" id="translation-panel" aria-labelledby="translation-title">
          <h3 id="translation-title">中文译文</h3>
          <div id="translation-content"></div>
        </div>
      </article>
    </section>
    <footer class="page-footer"><svg><use href="#i-volume"/></svg><span>点击即可重听，按 Esc 停止朗读。</span></footer>
  </main>

  <aside id="player" class="player" aria-label="当前朗读" hidden>
    <div class="player-progress" aria-hidden="true"><span id="player-progress"></span></div>
    <span class="player-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="player-copy"><span id="player-kind">正在朗读</span><strong id="player-text" lang="en"></strong></div>
    <span id="player-count" class="player-count"></span>
    <button id="stop-reading" class="stop-button" aria-label="停止朗读"><svg><use href="#i-stop"/></svg></button>
  </aside>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div id="screen-reader-status" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
