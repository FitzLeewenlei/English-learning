<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="高频重点词·英语点读。按 List 学习单词与真题例句，点击句中单词查看音标、词性、释义并听发音。">
  <title>高频重点词·英语点读</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230071e3'/%3E%3Cpath d='M16 18h13c4 0 6 3 6 5v25c-2-3-5-5-9-5H16zm32 0H35v30c2-3 5-5 9-5h4z' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=20261027-word-details">
  <script src="content.js?v=20261016-list1" defer></script>
  <script src="dictionary.js?v=20261027-word-details" defer></script>
  <script src="app.js?v=20261027-word-details" defer></script>
</head>
<body>
  <a class="skip-link" href="#vocabulary">跳到学习内容</a>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill-icon" d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect class="fill-icon" x="6" y="6" width="12" height="12" rx="3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2.4-2-5.7-2.7-9-2v15c3.3-.7 6.6 0 9 2m0-15c2.4-2 5.7-2.7 9-2v15c-3.3-.7-6.6 0-9 2V6Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  </svg>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="#top" aria-label="高频重点词·英语点读，回到顶部">
        <span class="brand-mark"><svg aria-hidden="true"><use href="#i-book"/></svg></span>
        <h1 class="brand-title">高频重点词·英语点读</h1>
      </a>
      <label class="list-control" for="list-select">
        <span class="visually-hidden">选择学习列表</span>
        <span class="select-wrap"><select id="list-select" aria-label="选择 List"></select><svg aria-hidden="true"><use href="#i-chevron"/></svg></span>
      </label>
    </div>
  </header>

  <main id="top" class="page">
    <div class="page-toolbar">
      <h2 id="current-list">List 1</h2>
      <label class="speed-control" for="speed"><span>朗读速度</span><span class="select-wrap"><select id="speed" aria-label="朗读速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option></select><svg aria-hidden="true"><use href="#i-chevron"/></svg></span></label>
    </div>

    <section id="vocabulary" class="learning-section" aria-labelledby="vocab-title">
      <div class="section-heading">
        <div><span class="section-index">01</span><h2 id="vocab-title">单词</h2><span class="section-caption" lang="en">Vocabulary</span></div>
        <button id="play-vocabulary" class="quiet-button"><svg><use href="#i-play"/></svg><span>依次朗读</span></button>
      </div>
      <div id="vocabulary-grid" class="vocabulary-grid"></div>
    </section>

    <section id="examples" class="learning-section examples-section" aria-labelledby="examples-title">
      <div class="section-heading">
        <div><span class="section-index">02</span><h2 id="examples-title">真题例句</h2><span class="section-caption" lang="en">Examples</span></div>
        <button id="play-examples" class="quiet-button" type="button"><svg aria-hidden="true"><use href="#i-play"/></svg><span>依次朗读</span></button>
      </div>
      <div id="examples-content" class="examples-paper"></div>
    </section>

  </main>

  <div id="word-details" class="word-details" popover="auto" role="dialog" aria-labelledby="word-detail-title" aria-describedby="word-detail-definition">
    <button id="word-detail-close" class="word-detail-close" type="button" aria-label="关闭单词卡片"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <h3 id="word-detail-title" lang="en"></h3>
    <div class="word-detail-pronunciation"><span id="word-detail-ipa" lang="en"></span><button id="word-detail-play" type="button" aria-label="播放单词发音"><svg aria-hidden="true"><use href="#i-volume"/></svg><span>发音</span></button></div>
    <div id="word-detail-definition" class="word-detail-definition"><span id="word-detail-pos" lang="en"></span><p id="word-detail-meaning" lang="zh-CN"></p></div>
  </div>

  <aside id="player" class="player" aria-label="当前朗读" hidden>
    <div class="player-progress" aria-hidden="true"><span id="player-progress"></span></div>
    <span class="player-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="player-copy"><span id="player-kind">正在朗读</span><strong id="player-text" lang="en"></strong></div>
    <span id="player-count" class="player-count"></span>
    <button id="stop-reading" class="stop-button" aria-label="停止朗读"><svg><use href="#i-stop"/></svg></button>
  </aside>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div id="screen-reader-status" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
