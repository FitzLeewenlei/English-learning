<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>English Learning Vocabulary</title>
<style>
body{font-family:Arial,"Microsoft YaHei";background:#f5f7fb;padding:30px;line-height:2}
h1{text-align:center}.article,.card{background:white;padding:25px;border-radius:12px;margin:20px auto;max-width:900px}
.word{color:#0066cc;font-weight:bold;cursor:pointer}.word:hover{text-decoration:underline}
#box{display:none;background:#fff3cd}.btn{padding:8px 15px;border:0;border-radius:8px;cursor:pointer}
.n{color:#0066cc}.v{color:#198754}.adj{color:#fd7e14}.adv{color:#6f42c1}
</style>
</head>
<body>
<h1>University Life and Money Management</h1>
<div class="article">
Students at <span class="word">university</span> can <span class="word">learn</span> and make <span class="word">friends</span> that will last a lifetime. However, the <span class="word">cost</span> of studying is on the rise. This <span class="word">increase</span> means students may get into <span class="word">trouble</span> if they do not know how to <span class="word">manage</span> money. Students need to <span class="word">budget</span> carefully.
</div>
<div id="box" class="card"></div>
<script>
const dictionary={
university:{ipa:'/ˌjuːnɪˈvɜːrsəti/',pos:'n.',cn:'大学',ex:'She studies at a famous university.'},
learn:{ipa:'/lɜːrn/',pos:'v.',cn:'学习；学会',ex:'Students learn new skills every day.'},
friends:{ipa:'/frendz/',pos:'n.',cn:'朋友',ex:'Good friends can last a lifetime.'},
cost:{ipa:'/kɔːst/',pos:'n.',cn:'费用；成本',ex:'The cost of education is increasing.'},
increase:{ipa:'/ɪnˈkriːs/',pos:'n./v.',cn:'增加；增长',ex:'There is an increase in prices.'},
trouble:{ipa:'/ˈtrʌbəl/',pos:'n.',cn:'麻烦；困难',ex:'He got into trouble.'},
manage:{ipa:'/ˈmænɪdʒ/',pos:'v.',cn:'管理；控制',ex:'Learn to manage your money.'},
budget:{ipa:'/ˈbʌdʒɪt/',pos:'n./v.',cn:'预算；规划开支',ex:'Students should make a budget.'}
};

document.querySelectorAll('.word').forEach(w=>{w.onclick=()=>{let d=dictionary[w.innerText];if(d){box.style.display='block';box.innerHTML=`<h2>${w.innerText}</h2><p>音标：${d.ipa}</p><p>词性：${d.pos}</p><p>中文：${d.cn}</p><p>例句：${d.ex}</p><button class='btn' onclick="speak('${w.innerText}')">🔊 发音</button><button class='btn' onclick="saveWord('${w.innerText}')">⭐ 生词本</button>`}}});
function speak(t){speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function saveWord(w){let a=JSON.parse(localStorage.words||'[]');if(!a.includes(w))a.push(w);localStorage.words=JSON.stringify(a);alert('已加入生词本')}
</script>
</body>
</html>
